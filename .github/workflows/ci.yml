name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, macOS]
    env:
      # The org self-hosted runner (mac-ext-01) has PostgreSQL 18 on the
      # loopback interface. Tests create and drop their own schemas.
      KEEL_BOARD_TEST_DSN: postgres://kzf@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: postgres
        run: |
          command -v pg_isready >/dev/null 2>&1 || export PATH="/opt/homebrew/bin:$PATH"
          pg_isready -h 127.0.0.1 -p 5432
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: race
        run: go test -race -count=1 ./...
      - name: cleanup go cache
        if: always()
        run: go clean -cache
