name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: board_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d board_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KEEL_BOARD_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/board_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: race
        run: go test -race -count=1 ./...
